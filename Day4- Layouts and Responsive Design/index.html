<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day4- Layouts and Responsive Design</title>
  </head>
  <body>
    <h1>Layouts and Responsive Design</h1>
    <!-- inline and inline-block and block -->
    <section>
      <span style="background-color: aquamarine"
        >this is inline by default</span
      >
        <span style="
          background-color: lightcoral;
          display: inline-block;
          width: 200px;
          height: 50px;
        "
      >
        this is inline-block
      </span>
      <span
        style="
          background-color: aqua;
          display: block;
          height: 50px;
        "
      >
        this is block
      </span>
    </section>
  </body>
</html>
